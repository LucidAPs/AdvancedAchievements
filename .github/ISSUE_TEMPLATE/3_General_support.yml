name: General support
description: Ask for configuration or usage help
labels: [support]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Advanced Achievements version
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server software, Minecraft version, and Java version
      placeholder: "Purpur 1.21.4, Java 21"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to configure and what happened.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: /aach doctor output
      description: Paste every page. The report does not include database credentials.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Include only the relevant sections and remove passwords or other secrets.
      render: yaml
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed passwords and other secrets from all pasted content.
          required: true
