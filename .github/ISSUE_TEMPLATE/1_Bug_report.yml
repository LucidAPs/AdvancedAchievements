name: Bug report
description: Report a reproducible error or regression
labels: [bug]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Advanced Achievements version
      placeholder: "12.0"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server software and version
      description: Current releases support Paper/Purpur 1.21+.
      placeholder: "Paper 1.21.4 build 123"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "21.0.6"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: /aach doctor output
      description: Paste every page. The report does not include database credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Explain the smallest sequence that reliably triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the complete exception and nearby startup warnings. Remove secrets first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed passwords and other secrets from all pasted content.
          required: true
